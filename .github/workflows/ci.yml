name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: for f in server.js lib/*.js connectors/*.js public/*.js; do node --check "$f"; done
      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t iweb .
      - name: Start it and check health
        run: |
          docker run -d --name iweb -p 3000:3000 iweb
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs iweb
          exit 1
